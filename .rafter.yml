# Live-probe config for sb-u14j / PR #53 (e158bb7).
# Deliberately uses ONLY the camelCase spelling + R-XXXXX rule selector that
# a customer would copy from CONFIG.md / the hosted report UI - the exact
# shapes the bug report says were silently dropped pre-fix.
scan:
  excludePaths:
    - "token.py"
  ignore:
    - paths: ["**"]
      rules: ["R-91AFF"]
      reason: "probe sb-u14j: suppressing insecure-random-for-security on app.js via R-XXXXX display id"
